[[mutant]]
id = "HVM18b"
# The cooldown read moved after the guard: in a haven the haven's line comes
# first (HV-T5's STOPP 0, choice 1).
file = "commands/hunting_commands.py"
old = '''        # 1. Per-character real-time rate limit.
        if not caller.cooldowns.ready("hunt"):
            left = caller.cooldowns.time_left("hunt", use_int=True)
            caller.msg(
                f"You are still recovering from the chase. "
                f"Wait {left}s before hunting again."
            )
            return

        # 2. Need a target name.
        target_name = self.args.strip()
        if not target_name:
            caller.msg("Hunt what?")
            return

        # 3. Resolve the target among huntable creatures in the room.
        creatures = [
            o for o in caller.location.contents
            if o.is_typeclass("typeclasses.creatures.Creature", exact=False)
        ]
        if not creatures:
            caller.msg("There is nothing here to hunt.")
            return
        target = caller.search(target_name, candidates=creatures)
        if not target:
            return  # search() already messaged the caller (no-match / multimatch)

        # 3b. The attack guard (Haven HV-T5; PV3, HV6): no hunt in a haven,
        #     the hunter's room or the quarry's. Asked after the cooldown and
        #     the search and before the claim, so a refusal costs nothing: no
        #     claim, no roll, no cooldown.
        refusal = haven.attack_refusal(caller, target)
        if refusal:
            caller.msg(refusal)
            return

'''
