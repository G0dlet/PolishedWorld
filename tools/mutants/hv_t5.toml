# HV-T5 -- hunt asks the guard (Haven decomposition §8; PV3, HV6).
# Run: python3 tools/mutate.py tools/mutants/hv_t5.toml --parallel 2
#
# Predicted fail counts (worked through the cases before the tests were
# written, lesson 497; one mutant for each choice taken at STOPP 0 that no
# listed mutant holds). The cooldown test lives under HVM16-HVM18, since the
# cooldown speaks before the guard in all three:
#   HVM16  3 -- the line alone, the refusal that costs nothing, P3's road
#   HVM17  1 -- the refusal that costs nothing: the claim is left set
#   HVM18  3 -- the line alone, the refusal that costs nothing, P3's road
#   HVM18b 1 -- the cooldown read after the guard (HV-T5's STOPP 0, choice 1)

modules = ["tests.test_hunt_resolution"]

[[mutant]]
id = "HVM16"
# The call removed: hunt runs in a haven.
file = "commands/hunting_commands.py"
old = '''        refusal = haven.attack_refusal(caller, target)
        if refusal:
            caller.msg(refusal)
            return
'''
new = '''        refusal = None
'''
expect = [
    "test_hunt_in_a_haven_gives_the_havens_line_alone",
    "test_a_refused_hunt_costs_nothing",
    "test_a_quarry_that_flees_into_a_haven_is_refused_there",
]

[[mutant]]
id = "HVM17"
# The guard asked after the claim: the refused hunter leaves hunted_by set.
file = "commands/hunting_commands.py"
old = '''        refusal = haven.attack_refusal(caller, target)
        if refusal:
            caller.msg(refusal)
            return

        # 4. Race guard: claim the creature for this hunt. ndb is per-process and
        #    set+checked synchronously within this single reactor tick, so two
        #    hunters cannot both pass this gate for the same creature. The
        #    Creature.at_death() pk-check is a second line of defence.
        if target.ndb.hunted_by is not None and target.ndb.hunted_by is not caller:
            caller.msg(
                f"Someone else is already hunting {target.get_display_name(caller)}."
            )
            return
        target.ndb.hunted_by = caller
'''
new = '''        # 4. Race guard: claim the creature for this hunt. ndb is per-process and
        #    set+checked synchronously within this single reactor tick, so two
        #    hunters cannot both pass this gate for the same creature. The
        #    Creature.at_death() pk-check is a second line of defence.
        if target.ndb.hunted_by is not None and target.ndb.hunted_by is not caller:
            caller.msg(
                f"Someone else is already hunting {target.get_display_name(caller)}."
            )
            return
        target.ndb.hunted_by = caller
        refusal = haven.attack_refusal(caller, target)
        if refusal:
            caller.msg(refusal)
            return
'''
expect = ["test_a_refused_hunt_costs_nothing"]

